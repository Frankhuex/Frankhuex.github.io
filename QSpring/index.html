<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q 弹工坊 · 让图片弹起来</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./"><span class="logo">Q</span> Q 弹工坊</a><div class="music-player" role="group" aria-label="邦友的酒播放器"><span class="music-title">活跃黑江乐 - 邦友的酒</span><button id="musicPlay" class="icon-button" type="button" aria-label="播放音乐" title="播放音乐"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button><input id="musicSeek" type="range" min="0" max="1000" step="1" value="0" aria-label="音乐进度" disabled><label class="music-loop"><input id="musicLoop" type="checkbox" role="switch">循环</label><audio id="music" preload="metadata" src="冷爵老湿 - 朋友的酒（邦多利）［活跃黑江乐原版授权］.mp3"></audio></div><span class="privacy">纯本地处理，图片不会上传到服务器</span></header>
<main>
<div class="workspace"><aside><section class="card"><div class="section-title"><h2>01 / 选择图片</h2><button id="demo" class="text-button">载入示例图</button></div><label class="upload" for="file"><strong>＋ 选择静态图片</strong><span>PNG、JPEG、WebP · 支持拖放</span></label><input hidden id="file" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/bmp"><p id="fileName" class="subtle"></p></section>
<section class="card"><div class="section-title"><h2>02 / 调整弹性</h2><button id="reset" class="text-button">重置</button></div><label class="field">拉伸倍率 k <output id="kValue"></output><input id="k" type="range" min="1" max="3" step="0.01" value="1.5"></label><label class="field">往返周期 <output id="durationValue"></output><input id="duration" type="range" min="0.2" max="5" step="any" value="0.46153846153846156"></label><div class="two-cols"><label>曲线类型<select id="family"><option value="sine">Sine · 正弦</option><option value="quad">Quad · 二次</option><option value="cubic" selected>Cubic · 三次</option><option value="quart">Quart · 四次</option><option value="quint">Quint · 五次</option><option value="expo">Expo · 指数</option><option value="circ">Circ · 圆形</option><option value="back">Back · 回弹</option><option value="elastic">Elastic · 弹性</option><option value="bounce">Bounce · 弹跳</option><option value="linear">Linear · 线性</option></select></label><label>缓动方向<select id="direction"><option value="inout">InOut · 缓入缓出</option><option value="in">In · 缓入</option><option value="out">Out · 缓出</option></select></label></div><label class="field" id="strengthField" hidden>回弹强度 <output id="strengthValue"></output><input id="strength" type="range" min="0.2" max="4" step="0.1" value="1.7"></label><label class="field" id="wavesField" hidden>振荡次数 <output id="wavesValue"></output><input id="waves" type="range" min="1" max="8" step="1" value="3"></label><canvas id="curve" width="600" height="130" aria-label="完整周期的拉伸曲线"></canvas></section>
</aside>
<section class="preview-panel"><div class="panel-top"><h2>效果预览</h2><span id="sourceInfo">内置示例</span></div><div id="dropzone" class="stage"><canvas id="preview" aria-label="Q 弹动画预览"></canvas><span class="drop-hint">拖入图片即可替换</span></div><div class="playbar"><button id="play" class="icon-button" aria-label="暂停预览" title="暂停预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM14 5h4v14h-4z" fill="currentColor"/></svg></button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="动画进度"><span id="time">0.00 s</span></div><div class="metrics"><div><small>当前宽度</small><strong id="widthStat">—</strong></div><div><small>当前高度</small><strong id="heightStat">—</strong></div><div><small>面积比例</small><strong>100%</strong></div></div><div class="export-controls"><h2>导出动图</h2><div class="two-cols"><label>目标帧率<select id="fps"><option>15</option><option selected>25</option><option>50</option></select></label><label>尺寸<select id="size"><option value="original" selected>540 × 480</option><option value="320">320 × 285</option><option value="480">480 × 427</option><option value="640">640 × 569</option><option value="800">800 × 712</option></select></label></div><div class="background-row"><label><input id="transparent" type="checkbox" checked> 透明背景</label><input id="bg" type="color" value="#fff5e9" aria-label="背景颜色" disabled></div><p id="exportInfo" class="subtle"></p><p id="sizeEstimate" class="subtle" title="根据像素量与图片复杂度估算，实际文件大小以下载结果为准。">预计大小：计算中…</p><button id="export" class="primary">生成 GIF ↓</button><button id="cancel" class="text-button" hidden>取消生成</button><progress id="progress" value="0" max="1" hidden></progress><a id="download" class="download" hidden>下载 GIF</a><p id="status" role="status" aria-live="polite"></p></div></section></div></main><script src="gif.js"></script><script src="app.js"></script><script src="music.js"></script></body></html>
