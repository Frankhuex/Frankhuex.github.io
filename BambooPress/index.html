<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#31584b"><title>BambooPress</title><link rel="preload" href="fonts/reading-serif.woff?v=20261108-wuli" as="font" type="font/woff" crossorigin><link rel="stylesheet" href="style.css?v=20261108-copyright-inline"><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"dc0311d6f7ef4c5092635a749c89f8df"}'></script></head><body><header><a id="header-back" hidden></a><span class="brand">BambooPress</span><nav><button id="settings-open">阅读设置</button></nav><form id="search-form" role="search"><div class="search-reveal" inert><input id="query" aria-label="搜索书名、作者或正文" type="search"><button id="search-cancel" type="button">取消</button></div><button id="search-submit" type="submit" aria-expanded="false" aria-controls="query">搜索</button></form></header><main id="app"></main><dialog id="settings" aria-labelledby="settings-title">
  <div class="settings-heading"><h2 id="settings-title">阅读设置</h2><form method="dialog"><button class="close" aria-label="关闭设置" title="关闭"><span aria-hidden="true">×</span></button></form></div>
  <div class="setting-row"><div class="setting-label"><label for="font">字号</label><output id="font-value" for="font"></output></div><input id="font" type="range" min="16" max="28" step="1"></div>
  <div class="setting-row"><div class="setting-label"><label for="leading">行距</label><output id="leading-value" for="leading"></output></div><input id="leading" type="range" min="1.5" max="2.5" step="0.1"></div>
  <fieldset class="setting-row paper-options"><legend>纸色</legend><label><input type="radio" name="paper" value="white"><span class="paper-white">纸白</span></label><label><input type="radio" name="paper" value="warm"><span class="paper-warm">暖纸</span></label><label><input type="radio" name="paper" value="night"><span class="paper-night">夜间</span></label></fieldset>
  <div class="setting-row signature-setting"><label for="signatures">显示作者署名</label><input id="signatures" type="checkbox" role="switch"></div>
</dialog><footer><div id="footer-brand">BambooPress</div>
